<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÓRIA — Fine China</title>
<meta name="description" content="ÓRIA Fine China — პრემიუმ ფაიფურის ბრენდი საქართველოსთვის. მალე.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #F8F5EC;
    --champagne: #D9D0C1;
    --taupe: #A89F8E;
    --warm-gray: #6B6357;
    --charcoal: #3A3328;
    --gold: #B08D3F;
    --gold-light: #C9A55C;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  html { scroll-behavior: smooth; }
 
  body {
    background: var(--ivory);
    color: var(--charcoal);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
 
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 6vw;
    position: relative;
    overflow: hidden;
  }
 
  /* soft background texture */
  .wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(176,141,63,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(176,141,63,0.06), transparent 40%);
    pointer-events: none;
  }
 
  .emblem {
    width: 56px;
    height: 56px;
    margin-bottom: 28px;
    opacity: 0.9;
  }
 
  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(3rem, 9vw, 5.5rem);
    letter-spacing: 0.08em;
    color: var(--charcoal);
    line-height: 1;
  }
 
  .brand .accent-dot {
    color: var(--gold);
  }
 
  .subbrand {
    margin-top: 14px;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: clamp(0.75rem, 1.6vw, 0.95rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--gold);
    padding-left: 0.55em; /* optical centering for letter-spacing */
  }
 
  .divider {
    width: 64px;
    height: 1px;
    background: var(--taupe);
    margin: 36px auto;
    position: relative;
  }
  .divider::before {
    content: "◆";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--ivory);
    color: var(--gold);
    font-size: 8px;
    padding: 0 10px;
  }
 
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 2.6vw, 1.6rem);
    color: var(--warm-gray);
    max-width: 34ch;
  }
 
  .desc {
    margin-top: 20px;
    font-size: clamp(0.9rem, 1.6vw, 1rem);
    color: var(--warm-gray);
    max-width: 46ch;
    font-weight: 300;
  }
 
  .status {
    margin-top: 46px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 26px;
    border: 1px solid var(--champagne);
    border-radius: 999px;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--warm-gray);
  }
 
  .status .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(176,141,63,0.5);
    animation: pulse 2.2s infinite;
  }
 
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(176,141,63,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(176,141,63,0); }
    100% { box-shadow: 0 0 0 0 rgba(176,141,63,0); }
  }
 
  form.notify {
    margin-top: 40px;
    display: flex;
    gap: 0;
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--taupe);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
 
  form.notify input[type="email"] {
    flex: 1;
    border: none;
    outline: none;
    padding: 14px 16px;
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    color: var(--charcoal);
    background: transparent;
  }
 
  form.notify input[type="email"]::placeholder {
    color: var(--taupe);
  }
 
  form.notify button {
    border: none;
    background: var(--charcoal);
    color: var(--ivory);
    padding: 0 22px;
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.25s ease;
    white-space: nowrap;
  }
 
  form.notify button:hover {
    background: var(--gold);
  }
 
  .form-note {
    margin-top: 12px;
    font-size: 0.72rem;
    color: var(--taupe);
    letter-spacing: 0.04em;
  }
 
  footer {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--taupe);
  }
 
  footer a {
    color: var(--warm-gray);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }
  footer a:hover {
    border-color: var(--gold);
  }
 
  @media (max-width: 480px) {
    .subbrand { letter-spacing: 0.4em; }
    form.notify { flex-direction: column; border-radius: 4px; }
    form.notify button { padding: 12px; }
  }
</style>
</head>
<body>
 
<div class="wrap">
 
  <svg class="emblem" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="32" cy="32" r="30.5" stroke="#B08D3F" stroke-width="1"/>
    <path d="M32 14 L34.5 26 L47 28 L34.5 30 L32 42 L29.5 30 L17 28 L29.5 26 Z" fill="#B08D3F" opacity="0.85"/>
    <circle cx="32" cy="28" r="2.2" fill="#B08D3F"/>
  </svg>
 
  <h1 class="brand">ÓR<span class="accent-dot">I</span>A</h1>
  <div class="subbrand">Fine China</div>
 
  <div class="divider" role="presentation"></div>
 
  <p class="tagline">ელეგანტური ფაიფური, შექმნილი ქართული სახლისთვის</p>
  <p class="desc">
    პრემიუმ ფაიფურის კოლექცია — დახვეწილი, ქალური და დროში გამძლე დიზაინით.
    სახლისთვის, სტუმართმოყვარეობისთვის და საჩუქრად.
  </p>
 
  <div class="status"><span class="pulse"></span> მალე</div>
 
  <form class="notify" action="#" onsubmit="return handleSubmit(event)">
    <input type="email" id="email" placeholder="შენი ელ-ფოსტა" required>
    <button type="submit">შეტყობინება</button>
  </form>
  <p class="form-note" id="formNote">გეცნობებით ლონჩის შესახებ პირველებს შორის.</p>
 
  <footer>
    <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
    &nbsp;·&nbsp; ÓRIA FINE CHINA © 2026
  </footer>
 
</div>
 
<script>
  function handleSubmit(e) {
    e.preventDefault();
    var note = document.getElementById('formNote');
    var email = document.getElementById('email').value;
    if (email) {
      note.textContent = "მადლობა! გამოგეხმაურებით " + email + "-ზე ლონჩის წინ.";
      document.getElementById('email').value = '';
    }
    return false;
  }
</script>
 
</body>
</html>
